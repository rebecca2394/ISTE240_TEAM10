<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Player Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            background-color: #f8f9fa;
        }

        tr:hover {
            background-color: #f1f3f5;
        }
    </style>
</head>

<body class="bg-dark text-light container py-4">

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold text-light-emphasis">Player Management</h2>
    <button id="addBtn" class="btn btn-primary px-4">+ Add Player</button>
</div>

<div class="card shadow-sm p-3 mb-4">
    <div class="input-group">
        <label for="search"></label><input type="text" id="search" class="form-control" placeholder="Search players by username...">
        <button id="searchBtn" class="btn btn-info px-4" style="min-width: 300px;">Search</button>
    </div>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <div id="result"></div>
    </div>
</div>

<div id="formBox" class="card p-3 mt-4 shadow" style="display:none;">
    <input type="hidden" id="playerId">

    <label for="username"></label><input id="username" class="form-control mb-2" placeholder="Username">
    <label for="email"></label><input id="email" class="form-control mb-2" placeholder="Email">
    <label for="password"></label><input id="password" type="password" class="form-control mb-3" placeholder="Password">

    <div class="d-flex gap-2">
        <button id="saveBtn" class="btn btn-success w-50">Save</button>
        <button id="cancelBtn" class="btn btn-secondary w-50">Cancel</button>
    </div>
</div>

<script>
    let API = "/api/players";

    function loadPlayers() {
        $.get(API, function(data) {
            let table = "<table class='table table-hover align-middle'>";
            table += "<thead class='table-secondary'>";
            table += "<tr><th>ID</th><th>Username</th><th>Email</th><th>Actions</th></tr>";
            table += "</thead><tbody>";

            for (let i = 0; i < data.length; i++) {
                let p = data[i];
                table += `<tr>
                            <td>${p.id}</td>
                            <td>${p.username}</td>
                            <td>${p.email}</td>
                            <td>
                                <button class="btn btn-warning btn-sm me-2" onclick="editPlayer(${p.id})">Edit</button>
                                <button class="btn btn-danger btn-sm" onclick="deletePlayer(${p.id})">Delete</button>
                            </td>
                        </tr>`;
            }
            table += "</tbody></table>";
            $("#result").html(table);
        }).fail(function() {
            $("#result").html("<p class='text-danger'>Error loading players</p>");
        });
    }

    $("#addBtn").click(function() {
        $("#formBox").show();
        $("#playerId").val("");
        $("#username").val("");
        $("#email").val("");
        $("#password").val("");
    });

    $("#cancelBtn").click(function() {
        $("#formBox").hide();
    });

    $("#saveBtn").click(function() {
        let id = $("#playerId").val();
        let player = {
            username: $("#username").val(),
            email: $("#email").val(),
            password: $("#password").val()
        };

        if (id) {
            $.ajax({
                url: API + "/" + id,
                type: "PUT",
                contentType: "application/json",
                data: JSON.stringify(player),
                success: function() {
                    loadPlayers();
                    $("#formBox").hide();
                }
            });
        } else {
            $.ajax({
                url: API,
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify(player),
                success: function() {
                    loadPlayers();
                    $("#formBox").hide();
                }
            });
        }
    });

    function deletePlayer(id) {
        if (confirm("Delete this player?")) {
            $.ajax({
                url: API + "/" + id,
                type: "DELETE",
                success: loadPlayers
            });
        }
    }

    function editPlayer(id) {
        $.get(API + "/" + id, function(p) {
            $("#playerId").val(p.id);
            $("#username").val(p.username);
            $("#email").val(p.email);
            $("#password").val("");
            $("#formBox").show();
        });
    }

    $("#searchBtn").click(function() {
        let username = $("#search").val().trim();
        if (username === "") {
            loadPlayers();
            return;
        }
        $.get(API + "/username/" + encodeURIComponent(username), function(data) {
            let table = "<table class='table table-hover align-middle'>";
            table += "<thead class='table-dark'>";
            table += "<tr><th>ID</th><th>Username</th><th>Email</th></tr>";
            table += "</thead><tbody>";
            table += `<tr>
                        <td>${data.id}</td>
                        <td>${data.username}</td>
                        <td>${data.email}</td>
                    </tr>`;
            table += "</tbody></table>";
            $("#result").html(table);
        }).fail(function() {
            $("#result").html("<p class='text-danger'>Player not found</p>");
            loadPlayers();
        });
    });

    $(document).ready(function() {
        loadPlayers();
    });
</script>

</body>
</html>
