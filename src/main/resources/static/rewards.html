<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rewards Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            background-color: #f8f9fa;
        }

        tr:hover {
            background-color: #f1f3f5;
        }
    </style>
</head>

<body class="bg-dark text-light container py-4">

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold text-light-emphasis">StellaVerse Rewards Management</h2>
    <button id="addBtn" class="btn btn-primary px-4">+ Add Rewards</button>
</div>

<div class="card shadow-sm p-3 mb-4">
    <div class="input-group">
        <input type="number" id="search" class="form-control" placeholder="Search by Player ID...">
        <button id="searchBtn" class="btn btn-info px-4" style="min-width: 300px;">Search</button>
    </div>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <div id="result"></div>
    </div>
</div>

<div id="formBox" class="card p-3 mt-4 shadow" style="display:none;">
    <input type="hidden" id="rewardId">

    <input id="playerId" type="number" class="form-control mb-2" placeholder="Player ID">
    <input id="gameId" type="number" class="form-control mb-2" placeholder="Game ID">
    <input id="badges" type="number" class="form-control mb-2" placeholder="Badges">
    <input id="bonus" type="number" class="form-control mb-2" placeholder="Bonus">
    <input id="maxDifficulty" type="number" class="form-control mb-2" placeholder="Max Difficulty">

    <select id="badgeAwarded" class="form-control mb-3">
        <option value="true">Badge Awarded</option>
        <option value="false">Not Awarded</option>
    </select>

    <div class="d-flex gap-2">
        <button id="saveBtn" class="btn btn-success w-50">Save</button>
        <button id="cancelBtn" class="btn btn-secondary w-50">Cancel</button>
    </div>
</div>

<script>

    let API = "/api/rewards";

    function loadRewards(){
        $.get(API, function(data){

            let table = "<table class='table table-hover align-middle'>";
            table += "<thead class='table-secondary'>";
            table += "<tr><th>Player</th><th>Game</th><th>Badges</th><th>Bonus</th><th>Status</th><th>Actions</th></tr>";
            table += "</thead><tbody>";

            for(let i=0; i<data.length; i++){
                let r = data[i];

                let status = r.badgeAwarded
                    ? "<span class='badge bg-success d-inline-block text-center' style='width:130px;'>Awarded</span>"
                    : "<span class='badge bg-danger d-inline-block text-center' style='width:130px;'>Not Awarded</span>";

                table += `<tr>
                <td>${r.playerId}</td>
                <td>${r.gameId}</td>
                <td>${r.badges}</td>
                <td>${r.bonus}</td>
                <td>${status}</td>
                <td>
                    <button class="btn btn-warning btn-sm me-2" onclick="editRewards(${r.id})">Edit</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteRewards(${r.id})">Delete</button>
                </td>
            </tr>`;
            }

            table += "</tbody></table>";

            $("#result").html(table);

        }).fail(function(){
            $("#result").html("<p class='text-danger'>Error loading data</p>");
        });
    }

    $("#addBtn").click(function(){
        $("#formBox").show();
    });

    $("#cancelBtn").click(function(){
        $("#formBox").hide();
    });

    $("#saveBtn").click(function(){

        let id = $("#rewardId").val();

        let rewards = {
            playerId: parseInt($("#playerId").val()),
            gameId: parseInt($("#gameId").val()),
            badges: parseInt($("#badges").val()),
            bonus: parseInt($("#bonus").val()),
            maxDifficulty: parseInt($("#maxDifficulty").val()),
            badgeAwarded: $("#badgeAwarded").val() === "true"
        };

        if(id){
            $.ajax({
                url: API + "/" + id,
                type: "PUT",
                contentType: "application/json",
                data: JSON.stringify(rewards),
                success: loadRewards
            });
        } else {
            $.ajax({
                url: API,
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify(rewards),
                success: loadRewards
            });
        }

        $("#formBox").hide();
        $("#rewardId").val("");
        $("input").val("");
    });

    function deleteRewards(id){
        $.ajax({
            url: API + "/" + id,
            type: "DELETE",
            success: loadRewards
        });
    }

    function editRewards(id){
        $.get(API + "/" + id, function(r){

            $("#rewardId").val(r.id);
            $("#playerId").val(r.playerId);
            $("#gameId").val(r.gameId);
            $("#badges").val(r.badges);
            $("#bonus").val(r.bonus);
            $("#maxDifficulty").val(r.maxDifficulty);
            $("#badgeAwarded").val(r.badgeAwarded);

            $("#formBox").show();
        });
    }

    $("#searchBtn").click(function(){

        let playerId = $("#search").val();

        $.get(API + "/search?playerId=" + playerId, function(data){

            let table = "<table class='table table-hover align-middle'>";
            table += "<thead class='table-dark'>";
            table += "<tr><th>Player</th><th>Game</th><th>Badges</th></tr>";
            table += "</thead><tbody>";

            for(let i=0; i<data.length; i++){
                let r = data[i];

                table += `<tr>
                <td>${r.playerId}</td>
                <td>${r.gameId}</td>
                <td>${r.badges}</td>
            </tr>`;
            }

            table += "</tbody></table>";

            $("#result").html(table);
        });

    });

    $(document).ready(function(){
        loadRewards();
    });

</script>

</body>
</html>
