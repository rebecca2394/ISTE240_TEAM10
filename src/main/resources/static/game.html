<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            background-color: #f8f9fa;
        }

        tr:hover {
            background-color: #f1f3f5;
        }
    </style>
</head>

<body class="bg-dark text-light container py-4">

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold text-light-emphasis">StellaVerse Game Management</h2>
    <button id="addBtn" class="btn btn-primary px-4">+ Add Game</button>
</div>

<div class="card shadow-sm p-3 mb-4">
    <div class="input-group">
        <label for="search"></label><input type="text" id="search" class="form-control" placeholder="Search games by name...">
        <button id="searchBtn" class="btn btn-info px-4" style="min-width: 300px;">Search</button>
    </div>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <div id="result"></div>
    </div>
</div>

<div id="formBox" class="card p-3 mt-4 shadow" style="display:none;">
    <input type="hidden" id="gameId">

    <label for="name"></label><input id="name" class="form-control mb-2" placeholder="Name">
    <label for="subject"></label><input id="subject" class="form-control mb-2" placeholder="Subject">
    <label for="topic"></label><input id="topic" class="form-control mb-2" placeholder="Topic">
    <label for="difficulty"></label><input id="difficulty" type="number" class="form-control mb-2" placeholder="Difficulty">
    <label for="levels"></label><input id="levels" type="number" class="form-control mb-2" placeholder="Levels">
    <label for="rounds"></label><input id="rounds" type="number" class="form-control mb-2" placeholder="Rounds">
    <label for="maxFails"></label><input id="maxFails" type="number" class="form-control mb-2" placeholder="Max Fails">

    <label for="available"></label><select id="available" class="form-control mb-3">
        <option value="true">Available</option>
        <option value="false">Not Available</option>
    </select>

    <div class="d-flex gap-2">
        <button id="saveBtn" class="btn btn-success w-50">Save</button>
        <button id="cancelBtn" class="btn btn-secondary w-50">Cancel</button>
    </div>
</div>

<script>

    let API = "/api/games";

    function loadGames(){
        $.get(API, function(data){

            let table = "<table class='table table-hover align-middle'>";
            table += "<thead class='table-secondary'>";
            table += "<tr><th>Name</th><th>Subject</th><th>Difficulty</th><th>Status</th><th>Actions</th></tr>";
            table += "</thead><tbody>";

            for(let i=0; i<data.length; i++){
                let g = data[i];

                let status = g.available
                    ? "<span class='badge bg-success d-inline-block text-center' style='width:130px;'>Available</span>"
                    : "<span class='badge bg-danger d-inline-block text-center' style='width:130px;'>Unavailable</span>";

                table += `<tr>
                <td>${g.name}</td>
                <td>${g.subject}</td>
                <td>${g.difficulty}</td>
                <td>${status}</td>
                <td>
                    <button class="btn btn-warning btn-sm me-2" onclick="editGame(${g.id})">Edit</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteGame(${g.id})">Delete</button>
                </td>
            </tr>`;
            }

            table += "</tbody></table>";

            $("#result").html(table);

        }).fail(function(){
            $("#result").html("<p class='text-danger'>Error loading data</p>");
        });
    }

    $("#addBtn").click(function(){
        $("#formBox").show();
    });

    $("#cancelBtn").click(function(){
        $("#formBox").hide();
    });

    $("#saveBtn").click(function(){

        let id = $("#gameId").val();

        let game = {
            name: $("#name").val(),
            subject: $("#subject").val(),
            topic: $("#topic").val(),
            difficulty: parseInt($("#difficulty").val()),
            levels: parseInt($("#levels").val()),
            rounds: parseInt($("#rounds").val()),
            maxFails: parseInt($("#maxFails").val()),
            available: $("#available").val() === "true"
        };

        if(id){
            $.ajax({
                url: API + "/" + id,
                type: "PUT",
                contentType: "application/json",
                data: JSON.stringify(game),
                success: loadGames
            });
        } else {
            $.ajax({
                url: API,
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify(game),
                success: loadGames
            });
        }

        $("#formBox").hide();
        $("#gameId").val("");
        $("input").val("");
    });

    function deleteGame(id){
        $.ajax({
            url: API + "/" + id,
            type: "DELETE",
            success: loadGames
        });
    }

    function editGame(id){
        $.get(API + "/" + id, function(g){

            $("#gameId").val(g.id);
            $("#name").val(g.name);
            $("#subject").val(g.subject);
            $("#topic").val(g.topic);
            $("#difficulty").val(g.difficulty);
            $("#levels").val(g.levels);
            $("#rounds").val(g.rounds);
            $("#maxFails").val(g.maxFails);
            $("#available").val(g.available);

            $("#formBox").show();
        });
    }

    $("#searchBtn").click(function(){

        let name = $("#search").val();

        $.get(API + "/search?name=" + name, function(data){

            let table = "<table class='table table-hover align-middle'>";
            table += "<thead class='table-dark'>";
            table += "<tr><th>Name</th><th>Subject</th><th>Difficulty</th></tr>";
            table += "</thead><tbody>";

            for(let i=0; i<data.length; i++){
                let g = data[i];

                table += `<tr>
                <td>${g.name}</td>
                <td>${g.subject}</td>
                <td>${g.difficulty}</td>
            </tr>`;
            }

            table += "</tbody></table>";

            $("#result").html(table);
        });

    });

    $(document).ready(function(){
        loadGames();
    });

</script>

</body>
</html>
